{% extends "base.html" %}

{% block titulo %}Entrar – Moonrise{% endblock %}

{% block corpo %}
<section class="cartao-conta">
  <img class="cartao-logo" src="/static/lua.png" alt="" width="96" height="57">
  <h1>Entrar</h1>
  <form class="formulario" method="post" action="/entrar?voltar={{ voltar|urlencode }}">
    <label>Usuário ou e-mail
      <input name="login" required autocomplete="username" autocapitalize="none">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button class="botao primario largo">Entrar</button>
  </form>
  <p class="troca">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p>
</section>
{% endblock %}
